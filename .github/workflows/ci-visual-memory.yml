name: Visual & Memory Audit (Nightly / Manual)

on:
  schedule:
    # Run nightly at 03:00 CST (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (visual, memory, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - visual
          - memory
      domain:
        description: 'Domain to run (f1, particles, rose, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - f1
          - particles
          - rose

concurrency:
  group: memory-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-memory-audit:
    name: Visual & Memory Audit (${{ inputs.suite || 'all' }} / ${{ inputs.domain || 'all' }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
      options: --ipc=host
    timeout-minutes: 30

    env:
      AUDIT_SUITE: ${{ inputs.suite || 'all' }}
      AUDIT_DOMAIN: ${{ inputs.domain || 'all' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Application
        run: pnpm build

      - name: Run Visual Audit (Playwright lifecycle & arrival timeline)
        if: env.AUDIT_SUITE == 'all' || env.AUDIT_SUITE == 'visual'
        run: pnpm check:showroom-acceptance

      - name: Run WebGL Lifecycle Audit
        if: env.AUDIT_SUITE == 'all' || env.AUDIT_SUITE == 'memory'
        run: pnpm check:webgl-lifecycle

      - name: Run MemLab Memory Leak Audit
        if: env.AUDIT_SUITE == 'all' || env.AUDIT_SUITE == 'memory'
        run: pnpm test:memory -- --scenario=${{ env.AUDIT_DOMAIN }}

      - name: Upload Visual & Memory Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-memory-audit-report-${{ env.AUDIT_SUITE }}-${{ env.AUDIT_DOMAIN }}
          path: |
            output/playwright/
            output/test-results/memory/
          retention-days: 14
