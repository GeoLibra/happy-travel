name: Visual & Memory Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-visual-memory.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'playwright.config.ts'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/e2e/**'
      - 'tests/memory/**'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (visual, memory, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - visual
          - memory
      domain:
        description: 'Domain filter (f1=showroom acceptance, particles=itinerary particles E2E, rose=rose modal E2E, all=run every visual domain)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - f1
          - particles
          - rose

concurrency:
  group: memory-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-memory-audit:
    name: Visual & Memory Audit (${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'memory' }} / ${{ github.event_name == 'workflow_dispatch' && inputs.domain || 'f1' }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
      options: --ipc=host
    timeout-minutes: 30

    env:
      AUDIT_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'memory' }}
      AUDIT_DOMAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.domain || 'f1' }}
      PUPPETEER_CACHE_DIR: /github/home/.cache/puppeteer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Puppeteer browser cache
        if: env.AUDIT_SUITE == 'all' || env.AUDIT_SUITE == 'memory'
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: Install Puppeteer Chrome for MemLab
        if: env.AUDIT_SUITE == 'all' || env.AUDIT_SUITE == 'memory'
        run: |
          echo "PUPPETEER_CACHE_DIR=${PUPPETEER_CACHE_DIR}"
          node node_modules/.pnpm/puppeteer@*/node_modules/puppeteer/install.mjs

      - name: Build Web Application
        run: pnpm build

      - name: Run Visual Audit (Playwright acceptance per domain)
        if: env.AUDIT_SUITE == 'all' || env.AUDIT_SUITE == 'visual'
        run: |
          if [ "${{ env.AUDIT_DOMAIN }}" = "f1" ]; then
            pnpm check:showroom-acceptance
          elif [ "${{ env.AUDIT_DOMAIN }}" = "particles" ]; then
            npx playwright test --project=particles-e2e-chromium
          elif [ "${{ env.AUDIT_DOMAIN }}" = "rose" ]; then
            npx playwright test --project=rose-e2e-chromium
          else
            pnpm check:showroom-acceptance
            npx playwright test --project=particles-e2e-chromium --project=rose-e2e-chromium
          fi

      - name: Run WebGL Lifecycle Audit
        if: (env.AUDIT_SUITE == 'all' || env.AUDIT_SUITE == 'memory') && (env.AUDIT_DOMAIN == 'all' || env.AUDIT_DOMAIN == 'f1')
        run: pnpm check:webgl-lifecycle

      - name: Run MemLab Memory Leak Audit
        if: env.AUDIT_SUITE == 'all' || env.AUDIT_SUITE == 'memory'
        run: pnpm test:memory -- --scenario=${{ env.AUDIT_DOMAIN }}

      - name: Upload Visual & Memory Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-memory-audit-report-${{ env.AUDIT_SUITE }}-${{ env.AUDIT_DOMAIN }}
          path: |
            output/playwright/
            output/test-results/memory/
            !output/test-results/memory/data/profile/**
          retention-days: 14
