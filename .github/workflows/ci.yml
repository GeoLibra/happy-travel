name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, deterministic checks, unit tests, and build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
      options: --ipc=host
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic checks
        run: |
          pnpm check:showroom-ui
          pnpm check:showroom-renderer-config
          pnpm check:showroom-story
          pnpm check:showroom-quality
          pnpm check:showroom-route
          pnpm check:showroom-director
          pnpm check:showroom-asset-manager
          pnpm check:showroom-materials
          pnpm check:showroom-effects
          pnpm check:showroom-audio
          pnpm check:f1-motion
          pnpm check:f1-glitch
          pnpm check:f1-wheel-hold
          pnpm check:f1-airflow
          pnpm check:f1-model
          pnpm check:f1-welcome
          pnpm check:f1-studio
          pnpm check:f1-showroom-interaction
          pnpm check:f1-arrival-motion
          pnpm check:f1-reflection
          pnpm check:rose-animation
          pnpm check:i18n

      - name: Fast Gate
        run: pnpm test:fast

      - name: Typecheck
        run: pnpm lint

      - name: Build
        run: pnpm build
